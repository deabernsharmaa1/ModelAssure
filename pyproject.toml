[project]
name = "modelassure"
version = "1.0.0"
description = "ModelAssure ReleaseGate — financial decision release assurance (Version 1, SME lending)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandera>=0.19",
  "jinja2>=3.1",
  "weasyprint>=61",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7",
  "cryptography>=42",
  "boto3>=1.34",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs PostgreSQL and the decision simulator",
]
filterwarnings = ["ignore::DeprecationWarning"]
